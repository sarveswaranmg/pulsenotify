services:
  db:
    image: postgres:17-alpine
    container_name: pulsenotify_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulsenotify}
      POSTGRES_USER: ${POSTGRES_USER:-pulsenotify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    ports:
      - "5433:5432"
    volumes:
      - pulsenotify_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsenotify} -d ${POSTGRES_DB:-pulsenotify}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulsenotify_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pulsenotify_pgdata:
